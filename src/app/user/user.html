<mat-card appearance="outlined">
  <mat-card-header>
        <input matInput [(ngModel)]="name" placeholder="הכנס את שמך כאן" />
  </mat-card-header>
  <mat-card-actions>
    <button matButton (click) = "openSnackBar()">תלחץ עלי</button>
  </mat-card-actions>
</mat-card>
